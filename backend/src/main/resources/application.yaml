spring:
  application:
    name: Librar
  datasource:
    url: jdbc:mariadb://mariadb:3306/librarDB
    username: root
    password: 1234
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: true

stock:
  low-stock: ${5}

security:
  jwt:
    secret-key: ${JWT_SECRET_KEY:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-time: ${JWT_EXPIRATION:86400000}
app:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}